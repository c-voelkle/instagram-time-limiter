<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Locked – Scroll Stop</title>
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <main>
    <header>
      <img src="icons/icon48.png" alt="" width="32" height="32">
      <h1>This page is locked</h1>
    </header>

    <p>
      Scroll Stop protects the browser's extensions page. Enter the password to open
      it for <span id="minutes"></span> minutes.
    </p>

    <form id="unlock-form" novalidate>
      <label for="password">Password</label>
      <div class="row">
        <input id="password" type="password" autocomplete="current-password" required autofocus>
        <button type="submit">Unlock</button>
      </div>
      <span id="feedback" class="feedback" role="status"></span>
    </form>

    <p id="contact-notice" class="warning" hidden></p>

    <p id="manual" class="warning" hidden></p>
  </main>

  <script src="shared.js"></script>
  <script src="unlock.js"></script>
</body>
</html>
