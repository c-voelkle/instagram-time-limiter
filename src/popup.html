<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Time Limiter for Instagram</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="28" height="28">
    <h1>Time Limiter for Instagram</h1>
  </header>

  <section class="today">
    <p class="label">Today on Instagram &amp; X</p>
    <p id="elapsed" class="elapsed">0m 00s</p>
    <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>
    <p id="status" class="status"></p>
  </section>

  <p id="incognito-warning" class="notice" hidden>
    Private/incognito windows aren't tracked. Turn on “Allow in incognito/private windows”
    for this extension to close that gap.
  </p>

  <p id="no-password" class="notice" hidden>
    No password is set, so anyone can change these limits.
    <button type="button" id="set-password" class="link">Set a password</button>
  </p>

  <form id="unlock-form" hidden>
    <label for="unlock-password">Password required to change settings</label>
    <div class="row">
      <input id="unlock-password" type="password" autocomplete="current-password" required>
      <button type="submit">Unlock</button>
    </div>
    <span id="unlock-feedback" class="feedback error" role="status"></span>
  </form>

  <form id="settings-form" novalidate>
    <fieldset id="settings-fields">
      <label for="daily-limit">
        Daily limit (minutes)
        <span class="hint">0 = no limit</span>
      </label>
      <input id="daily-limit" type="number" min="0" max="1440" step="1" required>

      <label for="curfew">
        Curfew time
        <span class="hint">Leave empty to disable</span>
      </label>
      <input id="curfew" type="time">

      <div class="actions">
        <button type="submit" id="save">Save</button>
        <span id="feedback" class="feedback" role="status"></span>
      </div>
    </fieldset>
  </form>

  <footer id="unlocked-footer" hidden>
    <span id="unlocked-until"></span>
    <button type="button" id="lock-now" class="link">Lock now</button>
    <button type="button" id="change-password" class="link">Change password</button>
  </footer>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
