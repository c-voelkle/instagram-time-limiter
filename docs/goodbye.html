<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Scroll Stop</title>
  <link rel="icon" href="icon.png">
  <style>
    :root { --bg: #fafafb; --surface: #ffffff; --fg: #18181c; --muted: #62626d; --border: #e4e4ea; --ok: #1a8a4a; --error: #c62828; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111114; --surface: #1a1a1f; --fg: #f2f2f5; --muted: #a0a0ab; --border: #2d2d35; --ok: #4cc27f; --error: #ff6b6b; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--fg);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%; max-width: 460px; padding: 32px 28px; text-align: center;
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    }
    img { width: 64px; height: 64px; }
    h1 { margin: 14px 0 8px; font-size: 22px; line-height: 1.3; }
    p { margin: 0; color: var(--muted); }
    #status { margin-top: 18px; font-weight: 600; }
    #status.ok { color: var(--ok); }
    #status.error { color: var(--error); }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="">
    <h1 id="title">Scroll Stop</h1>
    <p id="text"></p>
    <p id="status" role="status">Wird gesendet …</p>
  </main>

  <script>
    // Opened by the browser when the extension is removed (or from the
    // extension's setup page with test=1). Sends one email via FormSubmit.
    // The address is read from the URL fragment, which is never sent to
    // this site's server, and then removed from the address bar.
    const params = new URLSearchParams(location.hash.slice(1));
    const to = params.get('to') || '';
    const isTest = params.get('test') === '1';
    history.replaceState(null, '', location.pathname);

    const titleEl = document.getElementById('title');
    const textEl = document.getElementById('text');
    const statusEl = document.getElementById('status');

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = kind || '';
    }

    function browserName() {
      const ua = navigator.userAgent;
      if (/Edg\//.test(ua)) return 'Microsoft Edge';
      if (/OPR\//.test(ua)) return 'Opera';
      if (/Firefox\//.test(ua)) return 'Firefox';
      if (/Chrome\//.test(ua)) return 'Chrome';
      return 'einem Browser';
    }

    async function send() {
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) {
        titleEl.textContent = 'Scroll Stop';
        textEl.textContent = 'Es ist keine Kontaktadresse hinterlegt.';
        setStatus('');
        return;
      }

      const now = new Date();
      const date = now.toLocaleDateString('de-CH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      const time = now.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
      const browser = browserName();

      if (isTest) {
        titleEl.textContent = 'Test-E-Mail';
        textEl.textContent = `Eine Test-Nachricht wird an ${to} gesendet.`;
      } else {
        titleEl.textContent = 'Die Erweiterung wurde entfernt';
        textEl.textContent = `Wie angekündigt wird ${to} per E-Mail benachrichtigt.`;
      }

      const body = isTest
        ? {
            _subject: 'Test: Scroll Stop',
            _template: 'box',
            Nachricht: 'Dies ist eine Test-Nachricht. Benachrichtigungen an diese Adresse funktionieren.',
            Zeitpunkt: `${date}, ${time}`,
          }
        : {
            _subject: 'Scroll Stop wurde entfernt',
            _template: 'box',
            Nachricht: `Die Erweiterung „Scroll Stop“ wurde aus ${browser} entfernt.`,
            Zeitpunkt: `${date}, ${time}`,
          };

      try {
        const response = await fetch(`https://formsubmit.co/ajax/${encodeURIComponent(to)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(body),
        });
        const result = await response.json().catch(() => ({}));
        const message = String(result.message || '');

        if (String(result.success) === 'true') {
          setStatus(isTest ? `Gesendet. Prüfe das Postfach von ${to}.` : `${to} wurde benachrichtigt.`, 'ok');
        } else if (/activat/i.test(message)) {
          setStatus(
            `Einmalige Bestätigung nötig: ${to} hat eine E-Mail mit „Activate Form“ erhalten. ` +
              'Nach dem Klick darauf funktionieren die Benachrichtigungen.',
            'error'
          );
        } else {
          setStatus(`Senden fehlgeschlagen${message ? `: ${message}` : '.'}`, 'error');
        }
      } catch {
        setStatus('Senden fehlgeschlagen (keine Internetverbindung?).', 'error');
      }
    }

    send();
  </script>
</body>
</html>
